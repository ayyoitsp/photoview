extend type Query {
  """
  Get a list of media, ordered first by day, then by album if multiple media was found for the same day.
  """
  myTimeline(
    paginate: Pagination,
    onlyFavorites: Boolean,
    "Only fetch media that is older than this date"
    fromDate: Time
  ): [Media!]! @isAuthorized

  """
  Get the number of media per month in the timeline, ordered newest first.
  Intended for building a date scrubber: the counts let a client compute the
  total size of the timeline and the offset of any given month without
  fetching the media themselves.
  """
  myTimelineHistogram(
    onlyFavorites: Boolean
  ): [TimelineHistogramBucket!]! @isAuthorized

  """
  Every media date in the timeline, in timeline order, as seconds since the
  Unix epoch.

  The position of a date in this list is that media's offset into the timeline,
  so a client holding it can map any date to an exact page offset and knows the
  full length of the timeline without paging through it. Roughly 11 bytes per
  media on the wire, so a library of 85000 is about 200KB compressed.
  """
  myTimelineIndex(
    onlyFavorites: Boolean
  ): [Int!]! @isAuthorized
}

"""
The number of media items shot within a single calendar month.
"""
type TimelineHistogramBucket {
  "Calendar year, e.g. 2015"
  year: Int!
  "Calendar month, 1-12"
  month: Int!
  "Number of media items shot in this month"
  count: Int!
}
